# ------------------------------------------------------------------------------------
# DATABASE CONNECTION SETTINGS - CRITICAL FOR LOCAL DEPLOYMENT
# ------------------------------------------------------------------------------------
# Please update these properties to match your local database environment.
# This application uses MySQL.

# JDBC Driver Class Name
# For MySQL 8.x, com.mysql.cj.jdbc.Driver is standard.
# For older MySQL 5.x, it might be com.mysql.jdbc.Driver.
db.driverClassName=com.mysql.cj.jdbc.Driver

# Database URL
# Format: jdbc:mysql://<hostname>:<port>/<databaseName>?<parameters>
# - <hostname>: Usually localhost for local deployment.
# - <port>: Default MySQL port is 3306.
# - <databaseName>: The name of your database (e.g., hrms_db). Ensure this database exists.
# Parameters:
#   - useSSL=false: Disables SSL for simpler local setup. Set to true if your DB requires SSL.
#   - serverTimezone=UTC: Recommended to avoid timezone issues. Adjust if necessary.
#   - allowPublicKeyRetrieval=true: May be needed for MySQL 8+ with certain authentication methods.
db.url=jdbc:mysql://localhost:3306/hrms_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# Database Username
# The username for connecting to your database.
# 'root' is common for local development but not recommended for production.
db.username=root

# Database Password
# The password for the specified username.
# Replace 'password' with your actual database password.
db.password=password

# ------------------------------------------------------------------------------------
# Example for a different database name or port:
# db.url=jdbc:mysql://localhost:3307/my_hrms_db?useSSL=false&serverTimezone=UTC
# db.username=hrms_user
# db.password=hrms_password
# ------------------------------------------------------------------------------------
